services:
  postgres:
    image: postgres:16-alpine
    container_name: metro-postgres
    environment:
      POSTGRES_USER: metro
      POSTGRES_PASSWORD: metro
      POSTGRES_DB: metro-db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metro -d metro-db"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        TARGET: api
    container_name: metro-api
    profiles: ["api"]
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://metro:metro@postgres:5432/metro-db?sslmode=disable"
      HTTP_ADDR: ":8080"
      LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: .
      args:
        TARGET: bot
    container_name: metro-bot
    profiles: ["bot"]
    environment:
      DATABASE_URL: "postgres://metro:metro@postgres:5432/metro-db?sslmode=disable"
      BOT_TOKEN: "${BOT_TOKEN}"
      LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: